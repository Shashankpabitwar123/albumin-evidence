services:
  - type: web
    name: albumin-evidence
    runtime: docker
    plan: starter
    region: virginia
    healthCheckPath: /health
    disk:
      name: evidence-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_BUDGET_USD
        value: "5"
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
